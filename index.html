<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Reloj digital minimalista a pantalla completa." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Reloj</title>
  <style>
    :root { --bg:#080a0c; --digit:#c8ff5a; --off:#26351a; --date:rgba(244,245,242,.56); --line:rgba(244,245,242,.15); --glow:radial-gradient(ellipse 76% 90% at 84% 3%,rgba(37,65,106,.52),transparent 55%),radial-gradient(ellipse 58% 70% at 8% 105%,rgba(25,52,53,.36),transparent 58%); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html, body { width:100%; min-height:100%; margin:0; overflow:hidden; background:#080a0c; color:var(--digit); font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { min-height:100dvh; }
    button { font:inherit; color:inherit; }
    .app { position:relative; width:100%; min-height:100dvh; overflow:hidden; background:var(--bg); }
    .app::before { content:""; position:absolute; inset:0; pointer-events:none; background:var(--glow); }

    /* Solo se transforma al abrir los ajustes: nada se anima continuamente. */
    .clock { position:relative; z-index:1; min-height:100dvh; display:grid; place-items:center; padding:max(22px,env(safe-area-inset-top)) max(25px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(25px,env(safe-area-inset-left)); touch-action:pan-y; transition:transform 260ms ease,opacity 260ms ease; }
    .clock-inner { width:100%; display:flex; flex-direction:column; align-items:center; transform:translateY(-1vh); }
    .time { color:var(--digit); font-family:var(--display,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif); font-size:clamp(82px,21.6vw,340px); font-weight:var(--weight,650); font-variant-numeric:tabular-nums lining-nums; letter-spacing:var(--spacing,-.075em); line-height:.78; white-space:nowrap; text-align:center; user-select:none; transition:color 180ms ease,letter-spacing 180ms ease,font-weight 180ms ease; }
    .time-colon { display:inline-block; margin:0 .012em; }
    .date { margin-top:clamp(19px,5vh,44px); color:var(--date); font-size:clamp(10px,1.55vw,17px); font-weight:700; line-height:1; letter-spacing:.16em; text-align:center; text-transform:uppercase; user-select:none; }
    .date b { padding:0 .56em; color:var(--digit); font-weight:900; }

    /* El panel aparece únicamente con un deslizamiento; no contiene texto. */
    .settings { position:absolute; z-index:3; top:0; right:0; height:100%; width:clamp(185px,25vw,278px); display:flex; flex-direction:column; justify-content:center; gap:clamp(21px,5vh,42px); padding:max(18px,env(safe-area-inset-top)) 17px max(18px,env(safe-area-inset-bottom)); background:var(--bg); border-left:1px solid var(--line); box-shadow:-16px 0 42px rgba(0,0,0,.35); transform:translateX(101%); transition:transform 260ms ease; }
    .panel-open .settings { transform:translateX(0); }.panel-open .clock { transform:translateX(calc(-1 * min(145px,17vw))); opacity:.42; }
    .swatches { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
    .theme { appearance:none; position:relative; width:100%; aspect-ratio:1; padding:0; border:1px solid transparent; border-radius:12px; overflow:hidden; background:var(--sample); cursor:pointer; }
    .theme::after { content:""; position:absolute; inset:0; background:var(--sample-light); }
    .theme[aria-pressed="true"] { border-color:var(--digit); outline:1px solid color-mix(in srgb,var(--digit) 46%,transparent); outline-offset:2px; }
    .styles { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:clamp(18px,4vh,29px) 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
    .style { appearance:none; height:42px; padding:0; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; }
    .style[aria-pressed="true"] { border-color:var(--digit); background:color-mix(in srgb,var(--digit) 12%,transparent); }
    .glyph { width:32px; height:17px; display:flex; align-items:center; justify-content:center; gap:4px; }.glyph i { display:block; width:6px; height:17px; border-radius:4px; background:var(--digit); }
    .style[data-style="precise"] .glyph { gap:2px; }.style[data-style="precise"] .glyph i { width:5px; border-radius:0; }.style[data-style="wide"] .glyph { gap:8px; }.style[data-style="wide"] .glyph i { width:5px; height:15px; }
    .colors { display:flex; justify-content:center; gap:clamp(10px,1.7vw,16px); }.color { appearance:none; width:22px; height:22px; padding:0; border:2px solid transparent; border-radius:50%; background:var(--color); box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); cursor:pointer; }.color[aria-pressed="true"] { outline:2px solid var(--digit); outline-offset:3px; }
    /* Indicador discreto: aparece solo un instante y desaparece por completo. */
    .edge { position:absolute; z-index:2; top:50%; right:0; width:2px; height:33px; border-radius:4px 0 0 4px; background:var(--digit); opacity:0; transform:translateY(-50%); transition:opacity 360ms ease; pointer-events:none; }.edge.peek { opacity:.52; }

    @media (orientation:portrait) and (max-width:700px) { .time { font-size:clamp(68px,22vw,170px); }.clock-inner { transform:translateY(-3vh); }.date { margin-top:28px; }.settings { width:74vw; }.panel-open .clock { transform:translateX(-17vw); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Reloj digital">
    <div class="edge" id="edge" aria-hidden="true"></div>
    <section class="clock" aria-label="Hora actual">
      <div class="clock-inner">
        <div class="time" id="time" aria-label="Hora actual"><span id="hours">00</span><span class="time-colon">:</span><span id="minutes">00</span></div>
        <div class="date"><span id="weekday"></span><b>·</b><span id="fullDate"></span></div>
      </div>
    </section>
    <aside class="settings" id="settings" aria-label="Personalizar reloj" aria-hidden="true">
      <div class="swatches">
        <button class="theme" data-theme="night" aria-label="Fondo noche" aria-pressed="true" style="--sample:#080a0c;--sample-light:radial-gradient(circle at 72% 18%,#25416a,transparent 57%)"></button>
        <button class="theme" data-theme="paper" aria-label="Fondo papel" aria-pressed="false" style="--sample:#e9e4da;--sample-light:radial-gradient(circle at 30% 27%,#fff,transparent 43%)"></button>
        <button class="theme" data-theme="cobalt" aria-label="Fondo cobalto" aria-pressed="false" style="--sample:#10256d;--sample-light:radial-gradient(circle at 74% 35%,#05b9e8,transparent 55%)"></button>
        <button class="theme" data-theme="forest" aria-label="Fondo bosque" aria-pressed="false" style="--sample:#0b211c;--sample-light:radial-gradient(circle at 70% 20%,#356b4d,transparent 55%)"></button>
        <button class="theme" data-theme="plum" aria-label="Fondo ciruela" aria-pressed="false" style="--sample:#27152f;--sample-light:radial-gradient(circle at 75% 30%,#733864,transparent 55%)"></button>
        <button class="theme" data-theme="sunset" aria-label="Fondo atardecer" aria-pressed="false" style="--sample:#f08c65;--sample-light:linear-gradient(135deg,#f4be72,#d76789)"></button>
      </div>
      <div class="styles">
        <button class="style" data-style="soft" aria-label="Diseño suave" aria-pressed="true"><span class="glyph"><i></i><i></i></span></button>
        <button class="style" data-style="precise" aria-label="Diseño preciso" aria-pressed="false"><span class="glyph"><i></i><i></i></span></button>
        <button class="style" data-style="wide" aria-label="Diseño amplio" aria-pressed="false"><span class="glyph"><i></i><i></i></span></button>
      </div>
      <div class="colors">
        <button class="color" data-color="#c8ff5a" style="--color:#c8ff5a" aria-label="Lima" aria-pressed="true"></button>
        <button class="color" data-color="#66d9ff" style="--color:#66d9ff" aria-label="Azul" aria-pressed="false"></button>
        <button class="color" data-color="#ff8cc6" style="--color:#ff8cc6" aria-label="Rosa" aria-pressed="false"></button>
        <button class="color" data-color="#ffd166" style="--color:#ffd166" aria-label="Amarillo" aria-pressed="false"></button>
        <button class="color" data-color="#ffffff" style="--color:#ffffff" aria-label="Blanco" aria-pressed="false"></button>
      </div>
    </aside>
    <audio id="chime" preload="none" src="clock-click.wav"></audio>
  </main>
  <script>
    (() => {
      const root=document.documentElement, app=document.getElementById('app'), panel=document.getElementById('settings'), edge=document.getElementById('edge'), time=document.getElementById('time'), chime=document.getElementById('chime');
      const defaults={theme:'night',style:'soft',color:'#c8ff5a'};
      let config; try { config={...defaults,...JSON.parse(localStorage.getItem('ahora-clock-settings')||'{}')}; } catch { config={...defaults}; }
      const themes={
        night:{bg:'#080a0c',digit:'#c8ff5a',off:'#26351a',date:'rgba(244,245,242,.56)',line:'rgba(244,245,242,.15)',glow:'radial-gradient(ellipse 76% 90% at 84% 3%,rgba(37,65,106,.52),transparent 55%),radial-gradient(ellipse 58% 70% at 8% 105%,rgba(25,52,53,.36),transparent 58%)'},
        paper:{bg:'#e9e4da',digit:'#22211f',off:'#c9c4b9',date:'rgba(34,33,31,.56)',line:'rgba(34,33,31,.14)',glow:'radial-gradient(ellipse 70% 80% at 11% 5%,rgba(255,255,255,.92),transparent 54%),radial-gradient(ellipse 60% 60% at 100% 100%,rgba(194,171,137,.27),transparent 60%)'},
        cobalt:{bg:'#10256d',digit:'#ecf6ff',off:'#164087',date:'rgba(236,246,255,.58)',line:'rgba(236,246,255,.16)',glow:'radial-gradient(ellipse 67% 98% at 78% 0%,rgba(0,207,255,.55),transparent 53%),radial-gradient(ellipse 60% 70% at 4% 100%,rgba(68,68,209,.5),transparent 64%)'},
        forest:{bg:'#0b211c',digit:'#ecf4e8',off:'#1d4538',date:'rgba(236,244,232,.55)',line:'rgba(236,244,232,.14)',glow:'radial-gradient(ellipse 72% 85% at 89% 8%,rgba(45,111,74,.54),transparent 56%),radial-gradient(ellipse 60% 60% at 4% 95%,rgba(100,91,29,.22),transparent 65%)'},
        plum:{bg:'#27152f',digit:'#fff1fb',off:'#512b5e',date:'rgba(255,241,251,.55)',line:'rgba(255,241,251,.15)',glow:'radial-gradient(ellipse 75% 85% at 84% 8%,rgba(127,58,116,.6),transparent 55%),radial-gradient(ellipse 65% 70% at 6% 99%,rgba(57,46,118,.44),transparent 62%)'},
        sunset:{bg:'#f08c65',digit:'#32181a',off:'#cf715d',date:'rgba(50,24,26,.6)',line:'rgba(50,24,26,.18)',glow:'radial-gradient(ellipse 75% 90% at 83% 8%,rgba(255,232,143,.65),transparent 53%),radial-gradient(ellipse 66% 65% at 8% 100%,rgba(197,74,129,.32),transparent 62%)'}
      };
      const styleSettings={
        soft:{font:'ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif',weight:'650',spacing:'-.075em'},
        precise:{font:'ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace',weight:'760',spacing:'-.095em'},
        wide:{font:'ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif',weight:'430',spacing:'.005em'}
      };
      function apply(){
        const t=themes[config.theme]||themes.night, style=styleSettings[config.style]||styleSettings.soft;
        root.style.setProperty('--bg',t.bg); root.style.setProperty('--digit',config.color); root.style.setProperty('--date',t.date); root.style.setProperty('--line',t.line); root.style.setProperty('--glow',t.glow);
        root.style.setProperty('--display',style.font); root.style.setProperty('--weight',style.weight); root.style.setProperty('--spacing',style.spacing);
        document.querySelector('meta[name="theme-color"]').content=t.bg;
        document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.theme===config.theme));
        document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.style===config.style));
        document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color===config.color));
        localStorage.setItem('ahora-clock-settings',JSON.stringify(config));
      }
      function render(){
        const now=new Date();
        const h=String(now.getHours()).padStart(2,'0'), m=String(now.getMinutes()).padStart(2,'0');
        document.getElementById('hours').textContent=h; document.getElementById('minutes').textContent=m; time.setAttribute('aria-label',`${h}:${m}`);
        const parts=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(now);
        document.getElementById('weekday').textContent=parts.find(x=>x.type==='weekday')?.value||'';
        document.getElementById('fullDate').textContent=`${parts.find(x=>x.type==='day')?.value||''} ${parts.find(x=>x.type==='month')?.value||''} ${parts.find(x=>x.type==='year')?.value||''}`;
      }
      function open(){app.classList.add('panel-open');panel.setAttribute('aria-hidden','false');} function close(){app.classList.remove('panel-open');panel.setAttribute('aria-hidden','true');}
      document.querySelectorAll('[data-theme]').forEach(x=>x.addEventListener('click',()=>{config.theme=x.dataset.theme;apply();}));document.querySelectorAll('[data-style]').forEach(x=>x.addEventListener('click',()=>{config.style=x.dataset.style;apply();}));document.querySelectorAll('[data-color]').forEach(x=>x.addEventListener('click',()=>{config.color=x.dataset.color;apply();}));
      let audioReady=false, keepAwakeEnabled=false, wakeLock=null;
      function wakeSound(){if(audioReady)return;const old=chime.volume;chime.volume=0;chime.play().then(()=>{chime.pause();chime.currentTime=0;chime.volume=old||.32;audioReady=true;}).catch(()=>{chime.volume=old||.32;});}
      async function keepScreenAwake(){
        if(!keepAwakeEnabled||wakeLock||!('wakeLock' in navigator)||document.visibilityState!=='visible')return;
        try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}
      }
      function immersive(){
        wakeSound();keepAwakeEnabled=true;keepScreenAwake();
        if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});
      }
      let x0=0,y0=0;app.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;immersive();},{passive:true});app.addEventListener('pointerup',e=>{const dx=e.clientX-x0,dy=e.clientY-y0;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.15){if(dx<0)open();else close();}else if(app.classList.contains('panel-open')&&!panel.contains(e.target))close();},{passive:true});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='ArrowRight')close();if(e.key==='ArrowLeft')open();});
      function peek(){edge.classList.add('peek');setTimeout(()=>edge.classList.remove('peek'),1600);} 
      let first=true,timer; function nextMinute(){render();if(!first&&audioReady){chime.currentTime=0;chime.play().catch(()=>{});}first=false;clearTimeout(timer);timer=setTimeout(nextMinute,60000-(Date.now()%60000)+30);} document.addEventListener('visibilitychange',()=>{if(!document.hidden){first=true;nextMinute();keepScreenAwake();}});
      apply();nextMinute();peek();
      window.addEventListener('load',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    })();
  </script>
</body>
</html>
