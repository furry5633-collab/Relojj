<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#080a0c" />
  <meta name="description" content="Reloj minimalista a pantalla completa." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <title>Reloj</title>
  <style>
    :root { --bg:#080a0c; --digit:#c8ff5a; --date:rgba(244,245,242,.56); --line:rgba(244,245,242,.15); --glow:radial-gradient(ellipse 76% 90% at 84% 3%,rgba(37,65,106,.52),transparent 55%),radial-gradient(ellipse 58% 70% at 8% 105%,rgba(25,52,53,.36),transparent 58%); }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { width:100%; min-height:100%; margin:0; overflow:hidden; background:#080a0c; color:var(--digit); font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { min-height:100dvh; }
    button,input { font:inherit; color:inherit; }
    .app { position:relative; width:100%; min-height:100dvh; overflow:hidden; background:var(--bg); }
    .app::before { content:""; position:absolute; inset:0; pointer-events:none; background:var(--glow); }
    .clock { position:relative; z-index:1; min-height:100dvh; display:grid; place-items:center; padding:max(22px,env(safe-area-inset-top)) max(25px,env(safe-area-inset-right)) max(22px,env(safe-area-inset-bottom)) max(25px,env(safe-area-inset-left)); touch-action:pan-y; transition:transform 260ms ease,opacity 260ms ease; }
    .clock-inner { width:100%; display:flex; flex-direction:column; align-items:center; transform:translate(calc(var(--oled-x,0) * 1px),calc(-1vh + var(--oled-y,0) * 1px)); transition:transform 650ms ease; }
    .time { color:var(--digit); font-family:var(--display,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif); font-size:clamp(82px,21.6vw,340px); font-weight:var(--weight,650); font-variant-numeric:tabular-nums lining-nums; letter-spacing:var(--spacing,-.075em); line-height:.78; white-space:nowrap; text-align:center; user-select:none; transition:color 180ms ease,letter-spacing 180ms ease,font-weight 180ms ease; }
    .time-colon { display:inline-block; margin:0 .012em; }
    .date { margin-top:clamp(19px,5vh,44px); color:var(--date); font-size:clamp(10px,1.55vw,17px); font-weight:700; line-height:1; letter-spacing:.16em; text-align:center; text-transform:uppercase; user-select:none; }
    .date b { padding:0 .56em; color:var(--digit); font-weight:900; }
    .date-hidden .date { display:none; }
    .battery { position:absolute; top:max(24px,env(safe-area-inset-top)); left:max(25px,env(safe-area-inset-left)); width:22px; height:11px; padding:2px; border:1px solid color-mix(in srgb,var(--digit) 70%,transparent); border-radius:3px; opacity:.72; }
    .battery::after { content:""; position:absolute; top:3px; right:-3px; width:2px; height:4px; border-radius:0 2px 2px 0; background:var(--digit); }
    .battery-fill { display:block; width:75%; height:100%; border-radius:1px; background:var(--digit); transition:width 200ms ease; }
    .battery.charging .battery-fill { background:#ffd166; }
    .dimmer { position:absolute; z-index:2; inset:0; pointer-events:none; background:#000; opacity:0; transition:opacity 700ms ease; }
    .night-dim .dimmer { opacity:.58; }

    /* Panel visual: no muestra etiquetas, solamente colores e iconos. */
    .settings { position:absolute; z-index:4; top:0; right:0; height:100%; width:clamp(190px,26vw,292px); display:flex; flex-direction:column; justify-content:flex-start; gap:19px; padding:max(18px,env(safe-area-inset-top)) 17px max(18px,env(safe-area-inset-bottom)); overflow-y:auto; overscroll-behavior:contain; background:var(--bg); border-left:1px solid var(--line); box-shadow:-16px 0 42px rgba(0,0,0,.35); transform:translateX(101%); transition:transform 260ms ease; }
    .panel-open .settings { transform:translateX(0); }.panel-open .clock { transform:translateX(calc(-1 * min(145px,17vw))); opacity:.42; }
    .swatches { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }.theme { appearance:none; position:relative; width:100%; aspect-ratio:1; padding:0; border:1px solid transparent; border-radius:12px; overflow:hidden; background:var(--sample); cursor:pointer; }.theme::after { content:""; position:absolute; inset:0; background:var(--sample-light); }.theme[aria-pressed="true"] { border-color:var(--digit); outline:1px solid color-mix(in srgb,var(--digit) 46%,transparent); outline-offset:2px; }
    .styles { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding:19px 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }.style { appearance:none; height:42px; padding:0; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; background:transparent; cursor:pointer; }.style[aria-pressed="true"] { border-color:var(--digit); background:color-mix(in srgb,var(--digit) 12%,transparent); }.glyph { width:32px; height:17px; display:flex; align-items:center; justify-content:center; gap:4px; }.glyph i { display:block; width:6px; height:17px; border-radius:4px; background:var(--digit); }.style[data-style="precise"] .glyph { gap:2px; }.style[data-style="precise"] .glyph i { width:5px; border-radius:0; }.style[data-style="wide"] .glyph { gap:8px; }.style[data-style="wide"] .glyph i { width:5px; height:15px; }
    .colors { display:flex; justify-content:center; gap:clamp(10px,1.7vw,16px); }.color { appearance:none; width:22px; height:22px; padding:0; border:2px solid transparent; border-radius:50%; background:var(--color); box-shadow:inset 0 0 0 1px rgba(255,255,255,.35); cursor:pointer; }.color[aria-pressed="true"] { outline:2px solid var(--digit); outline-offset:3px; }
    .utility-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; padding-top:19px; border-top:1px solid var(--line); }.utility { appearance:none; height:39px; padding:0; display:grid; place-items:center; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--date); cursor:pointer; }.utility svg { width:17px; height:17px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }.utility .number-icon { font-size:11px; font-weight:800; letter-spacing:-.06em; }.utility[aria-pressed="true"] { color:var(--digit); border-color:var(--digit); background:color-mix(in srgb,var(--digit) 12%,transparent); }
    .control-row { display:grid; grid-template-columns:39px 1fr 1fr; gap:9px; align-items:center; }.control-row .utility { width:39px; }.control-row input[type="range"] { min-width:0; width:100%; accent-color:var(--digit); cursor:pointer; }.time-input { width:100%; height:39px; padding:0 6px; border:1px solid var(--line); border-radius:10px; background:transparent; color:var(--date); color-scheme:dark; text-align:center; font-size:12px; outline:none; }.time-input:focus { border-color:var(--digit); color:var(--digit); }
    .edge { position:absolute; z-index:3; top:50%; right:0; width:2px; height:33px; border-radius:4px 0 0 4px; background:var(--digit); opacity:0; transform:translateY(-50%); transition:opacity 360ms ease; pointer-events:none; }.edge.peek { opacity:.52; }
    @media (orientation:portrait) and (max-width:700px) { .time { font-size:clamp(68px,22vw,170px); }.clock-inner { transform:translate(calc(var(--oled-x,0) * 1px),calc(-3vh + var(--oled-y,0) * 1px)); }.date { margin-top:28px; }.settings { width:74vw; }.panel-open .clock { transform:translateX(-17vw); } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { transition-duration:.01ms !important; } }
  </style>
</head>
<body>
  <main class="app" id="app" aria-label="Reloj">
    <div class="edge" id="edge" aria-hidden="true"></div>
    <section class="clock" aria-label="Hora actual">
      <div class="battery" id="battery" hidden aria-label="Batería"><span class="battery-fill" id="batteryFill"></span></div>
      <div class="clock-inner">
        <div class="time" id="time" aria-label="Hora actual"><span id="hours">00</span><span class="time-colon">:</span><span id="minutes">00</span></div>
        <div class="date" id="dateLine"><span id="weekday"></span><b>·</b><span id="fullDate"></span></div>
      </div>
    </section>
    <div class="dimmer" aria-hidden="true"></div>

    <aside class="settings" id="settings" aria-label="Personalizar reloj" aria-hidden="true">
      <div class="swatches">
        <button class="theme" data-theme="night" aria-label="Fondo noche" aria-pressed="true" style="--sample:#080a0c;--sample-light:radial-gradient(circle at 72% 18%,#25416a,transparent 57%)"></button>
        <button class="theme" data-theme="paper" aria-label="Fondo papel" aria-pressed="false" style="--sample:#e9e4da;--sample-light:radial-gradient(circle at 30% 27%,#fff,transparent 43%)"></button>
        <button class="theme" data-theme="cobalt" aria-label="Fondo cobalto" aria-pressed="false" style="--sample:#10256d;--sample-light:radial-gradient(circle at 74% 35%,#05b9e8,transparent 55%)"></button>
        <button class="theme" data-theme="forest" aria-label="Fondo bosque" aria-pressed="false" style="--sample:#0b211c;--sample-light:radial-gradient(circle at 70% 20%,#356b4d,transparent 55%)"></button>
        <button class="theme" data-theme="plum" aria-label="Fondo ciruela" aria-pressed="false" style="--sample:#27152f;--sample-light:radial-gradient(circle at 75% 30%,#733864,transparent 55%)"></button>
        <button class="theme" data-theme="sunset" aria-label="Fondo atardecer" aria-pressed="false" style="--sample:#f08c65;--sample-light:linear-gradient(135deg,#f4be72,#d76789)"></button>
      </div>
      <div class="styles">
        <button class="style" data-style="soft" aria-label="Diseño suave" aria-pressed="true"><span class="glyph"><i></i><i></i></span></button>
        <button class="style" data-style="precise" aria-label="Diseño preciso" aria-pressed="false"><span class="glyph"><i></i><i></i></span></button>
        <button class="style" data-style="wide" aria-label="Diseño amplio" aria-pressed="false"><span class="glyph"><i></i><i></i></span></button>
      </div>
      <div class="colors">
        <button class="color" data-color="#c8ff5a" style="--color:#c8ff5a" aria-label="Lima" aria-pressed="true"></button>
        <button class="color" data-color="#66d9ff" style="--color:#66d9ff" aria-label="Azul" aria-pressed="false"></button>
        <button class="color" data-color="#ff8cc6" style="--color:#ff8cc6" aria-label="Rosa" aria-pressed="false"></button>
        <button class="color" data-color="#ffd166" style="--color:#ffd166" aria-label="Amarillo" aria-pressed="false"></button>
        <button class="color" data-color="#ffffff" style="--color:#ffffff" aria-label="Blanco" aria-pressed="false"></button>
      </div>
      <div class="utility-grid">
        <button class="utility" data-toggle="oled" aria-label="Protección OLED" aria-pressed="true" title="Protección OLED"><svg viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.4 2.9 8.5 7 10 4.1-1.5 7-5.6 7-10V6l-7-3Z"/><path d="M9 12h6M12 9v6"/></svg></button>
        <button class="utility" data-toggle="showDate" aria-label="Mostrar fecha" aria-pressed="true" title="Fecha"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h.01M12 14h.01M16 14h.01"/></svg></button>
        <button class="utility" data-toggle="format24" aria-label="Formato de 24 horas" aria-pressed="true" title="Formato 24 horas"><span class="number-icon">24</span></button>
        <button class="utility" data-toggle="autoColor" aria-label="Color automático" aria-pressed="false" title="Color automático"><svg viewBox="0 0 24 24"><circle cx="13.5" cy="10.5" r="7.5"/><circle cx="8.5" cy="9" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="6.5" r="1" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="12" r="1" fill="currentColor" stroke="none"/><path d="M13 18c0-2 1-3 3-3h2.1A2.9 2.9 0 0 1 13 18Z"/></svg></button>
        <button class="utility" data-toggle="showBattery" aria-label="Mostrar batería" aria-pressed="false" title="Batería"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="17" height="10" rx="2"/><path d="M21 10v4M6 10v4M9 10v4M12 10v4M15 10v4"/></svg></button>
      </div>
      <div class="control-row">
        <button class="utility" data-toggle="nightMode" aria-label="Brillo nocturno automático" aria-pressed="true" title="Brillo nocturno"><svg viewBox="0 0 24 24"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4 8.5 8.5 0 1 0 20 15.2Z"/></svg></button>
        <input class="time-input" id="nightStart" type="time" aria-label="Comienzo del modo nocturno" value="22:00" />
        <input class="time-input" id="nightEnd" type="time" aria-label="Fin del modo nocturno" value="07:00" />
      </div>
      <div class="control-row">
        <button class="utility" data-toggle="muted" aria-label="Silenciar click" aria-pressed="false" title="Silenciar"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="m17 9 4 6m0-6-4 6"/></svg></button>
        <input id="volume" type="range" min="0" max="100" value="32" aria-label="Volumen del click" />
        <span aria-hidden="true"></span>
      </div>
      <div class="control-row">
        <button class="utility" data-toggle="alarmEnabled" aria-label="Activar alarma" aria-pressed="false" title="Alarma"><svg viewBox="0 0 24 24"><path d="M18 8A7 7 0 1 0 6 8M4 4l2 2M20 4l-2 2M12 12v4l2 1M9 21h6"/><path d="M18.5 9.5 20 8"/></svg></button>
        <input class="time-input" id="alarmTime" type="time" aria-label="Hora de alarma" value="07:00" />
        <span aria-hidden="true"></span>
      </div>
    </aside>
    <audio id="chime" preload="none" src="clock-click.wav"></audio>
  </main>

  <script>
    (() => {
      const root=document.documentElement, app=document.getElementById('app'), panel=document.getElementById('settings'), edge=document.getElementById('edge'), time=document.getElementById('time'), chime=document.getElementById('chime'), battery=document.getElementById('battery'), batteryFill=document.getElementById('batteryFill');
      const defaults={theme:'night',style:'soft',color:'#c8ff5a',oled:true,nightMode:true,nightStart:'22:00',nightEnd:'07:00',showDate:true,format24:true,autoColor:false,showBattery:false,muted:false,volume:32,alarmEnabled:false,alarmTime:'07:00'};
      let config; try{config={...defaults,...JSON.parse(localStorage.getItem('reloj-settings')||'{}')};}catch{config={...defaults};}
      const themes={
        night:{bg:'#080a0c',date:'rgba(244,245,242,.56)',line:'rgba(244,245,242,.15)',glow:'radial-gradient(ellipse 76% 90% at 84% 3%,rgba(37,65,106,.52),transparent 55%),radial-gradient(ellipse 58% 70% at 8% 105%,rgba(25,52,53,.36),transparent 58%)'},
        paper:{bg:'#e9e4da',date:'rgba(34,33,31,.56)',line:'rgba(34,33,31,.14)',glow:'radial-gradient(ellipse 70% 80% at 11% 5%,rgba(255,255,255,.92),transparent 54%),radial-gradient(ellipse 60% 60% at 100% 100%,rgba(194,171,137,.27),transparent 60%)'},
        cobalt:{bg:'#10256d',date:'rgba(236,246,255,.58)',line:'rgba(236,246,255,.16)',glow:'radial-gradient(ellipse 67% 98% at 78% 0%,rgba(0,207,255,.55),transparent 53%),radial-gradient(ellipse 60% 70% at 4% 100%,rgba(68,68,209,.5),transparent 64%)'},
        forest:{bg:'#0b211c',date:'rgba(236,244,232,.55)',line:'rgba(236,244,232,.14)',glow:'radial-gradient(ellipse 72% 85% at 89% 8%,rgba(45,111,74,.54),transparent 56%),radial-gradient(ellipse 60% 60% at 4% 95%,rgba(100,91,29,.22),transparent 65%)'},
        plum:{bg:'#27152f',date:'rgba(255,241,251,.55)',line:'rgba(255,241,251,.15)',glow:'radial-gradient(ellipse 75% 85% at 84% 8%,rgba(127,58,116,.6),transparent 55%),radial-gradient(ellipse 65% 70% at 6% 99%,rgba(57,46,118,.44),transparent 62%)'},
        sunset:{bg:'#f08c65',date:'rgba(50,24,26,.6)',line:'rgba(50,24,26,.18)',glow:'radial-gradient(ellipse 75% 90% at 83% 8%,rgba(255,232,143,.65),transparent 53%),radial-gradient(ellipse 66% 65% at 8% 100%,rgba(197,74,129,.32),transparent 62%)'}
      };
      const styles={soft:{font:'ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif',weight:'650',spacing:'-.075em'},precise:{font:'ui-monospace,"SF Mono","Roboto Mono",Consolas,monospace',weight:'760',spacing:'-.095em'},wide:{font:'ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif',weight:'430',spacing:'.005em'}};
      const validTime=x=>/^([01]\d|2[0-3]):[0-5]\d$/.test(x);
      if(!themes[config.theme])config.theme=defaults.theme;if(!styles[config.style])config.style=defaults.style;if(!validTime(config.nightStart))config.nightStart=defaults.nightStart;if(!validTime(config.nightEnd))config.nightEnd=defaults.nightEnd;if(!validTime(config.alarmTime))config.alarmTime=defaults.alarmTime;config.volume=Math.max(0,Math.min(100,Number(config.volume)||0));
      let batteryManager=null,audioReady=false,keepAwakeEnabled=false,wakeLock=null,minuteTimer=null,firstRender=true,lastAlarmKey='',alarmTimers=[];
      const set=(name,value)=>root.style.setProperty(name,value);
      const hourOf=value=>Number(value.split(':')[0]);
      function isNight(hour){const start=hourOf(config.nightStart),end=hourOf(config.nightEnd);return start===end?false:(start<end?hour>=start&&hour<end:hour>=start||hour<end);}
      function colorFor(hour){if(!config.autoColor)return config.color;if(hour>=6&&hour<10)return '#66d9ff';if(hour>=10&&hour<18)return '#c8ff5a';if(hour>=18&&hour<22)return '#ffd166';return '#8cc8ff';}
      function updateOled(now){if(!config.oled){set('--oled-x',0);set('--oled-y',0);return;}const positions=[[0,0],[2,0],[2,1],[0,1],[-2,1],[-2,0],[-2,-1],[0,-1],[2,-1]];const p=positions[Math.floor(now.getTime()/300000)%positions.length];set('--oled-x',p[0]);set('--oled-y',p[1]);}
      function syncControls(){
        document.querySelectorAll('[data-theme]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.theme===config.theme));document.querySelectorAll('[data-style]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.style===config.style));document.querySelectorAll('[data-color]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.color===config.color));document.querySelectorAll('[data-toggle]').forEach(x=>x.setAttribute('aria-pressed',Boolean(config[x.dataset.toggle])));
        document.getElementById('volume').value=config.volume;document.getElementById('alarmTime').value=config.alarmTime;document.getElementById('nightStart').value=config.nightStart;document.getElementById('nightEnd').value=config.nightEnd;
      }
      function setSoundVolume(){chime.volume=config.muted?0:config.volume/100;}
      function updateBattery(){if(!batteryManager||!config.showBattery){battery.hidden=true;return;}const level=Math.round(batteryManager.level*100);batteryFill.style.width=level+'%';battery.classList.toggle('charging',batteryManager.charging);battery.setAttribute('aria-label',`Batería ${level}%${batteryManager.charging?', cargando':''}`);battery.hidden=false;}
      function apply(now=new Date()){
        const t=themes[config.theme],s=styles[config.style];set('--bg',t.bg);set('--date',t.date);set('--line',t.line);set('--glow',t.glow);set('--display',s.font);set('--weight',s.weight);set('--spacing',s.spacing);set('--digit',colorFor(now.getHours()));
        app.classList.toggle('date-hidden',!config.showDate);app.classList.toggle('night-dim',config.nightMode&&isNight(now.getHours()));document.querySelector('meta[name="theme-color"]').content=t.bg;setSoundVolume();syncControls();updateOled(now);updateBattery();localStorage.setItem('reloj-settings',JSON.stringify(config));
      }
      function render(now){let h=now.getHours();if(!config.format24)h=h%12||12;const hours=String(h).padStart(2,'0'),minutes=String(now.getMinutes()).padStart(2,'0');document.getElementById('hours').textContent=hours;document.getElementById('minutes').textContent=minutes;time.setAttribute('aria-label',`${hours}:${minutes}`);const parts=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).formatToParts(now);document.getElementById('weekday').textContent=parts.find(x=>x.type==='weekday')?.value||'';document.getElementById('fullDate').textContent=`${parts.find(x=>x.type==='day')?.value||''} ${parts.find(x=>x.type==='month')?.value||''} ${parts.find(x=>x.type==='year')?.value||''}`;}
      function playClick(){if(!audioReady||config.muted)return;chime.currentTime=0;chime.play().catch(()=>{});}
      function stopAlarm(){alarmTimers.forEach(clearTimeout);alarmTimers=[];chime.pause();chime.currentTime=0;}
      function ringAlarm(){stopAlarm();for(let i=0;i<7;i++)alarmTimers.push(setTimeout(playClick,i*720));}
      function checkAlarm(now){if(!config.alarmEnabled)return false;const key=`${now.toDateString()}-${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;if(key.endsWith(config.alarmTime)&&key!==lastAlarmKey){lastAlarmKey=key;ringAlarm();return true;}return false;}
      function open(){app.classList.add('panel-open');panel.setAttribute('aria-hidden','false');}function close(){app.classList.remove('panel-open');panel.setAttribute('aria-hidden','true');}
      function wakeSound(){if(audioReady)return;const original=chime.volume;chime.volume=0;chime.play().then(()=>{chime.pause();chime.currentTime=0;audioReady=true;chime.volume=original;setSoundVolume();}).catch(()=>{chime.volume=original;});}
      async function keepScreenAwake(){if(!keepAwakeEnabled||wakeLock||!('wakeLock'in navigator)||document.visibilityState!=='visible')return;try{wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}catch(e){}}
      function immersive(){wakeSound();keepAwakeEnabled=true;keepScreenAwake();if(!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().then(()=>screen.orientation?.lock?.('landscape').catch(()=>{})).catch(()=>{});}
      document.querySelectorAll('[data-theme]').forEach(x=>x.addEventListener('click',()=>{config.theme=x.dataset.theme;apply();}));document.querySelectorAll('[data-style]').forEach(x=>x.addEventListener('click',()=>{config.style=x.dataset.style;apply();}));document.querySelectorAll('[data-color]').forEach(x=>x.addEventListener('click',()=>{config.color=x.dataset.color;apply();}));document.querySelectorAll('[data-toggle]').forEach(x=>x.addEventListener('click',()=>{const k=x.dataset.toggle;config[k]=!config[k];apply();}));
      document.getElementById('volume').addEventListener('input',e=>{config.volume=Number(e.target.value);if(config.volume>0)config.muted=false;apply();});document.getElementById('alarmTime').addEventListener('change',e=>{if(validTime(e.target.value)){config.alarmTime=e.target.value;apply();}});document.getElementById('nightStart').addEventListener('change',e=>{if(validTime(e.target.value)){config.nightStart=e.target.value;apply();}});document.getElementById('nightEnd').addEventListener('change',e=>{if(validTime(e.target.value)){config.nightEnd=e.target.value;apply();}});
      async function initBattery(){if(!navigator.getBattery)return;try{batteryManager=await navigator.getBattery();['levelchange','chargingchange'].forEach(e=>batteryManager.addEventListener(e,updateBattery));updateBattery();}catch(e){}}
      let x0=0,y0=0;app.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;stopAlarm();immersive();},{passive:true});app.addEventListener('pointerup',e=>{const dx=e.clientX-x0,dy=e.clientY-y0;if(Math.abs(dx)>58&&Math.abs(dx)>Math.abs(dy)*1.15){if(dx<0)open();else close();}else if(app.classList.contains('panel-open')&&!panel.contains(e.target))close();},{passive:true});
      document.addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='ArrowRight')close();if(e.key==='ArrowLeft')open();});
      function peek(){edge.classList.add('peek');setTimeout(()=>edge.classList.remove('peek'),1600);}
      function nextMinute(){const now=new Date();render(now);apply(now);const alarmed=checkAlarm(now);if(!firstRender&&!alarmed)playClick();firstRender=false;clearTimeout(minuteTimer);minuteTimer=setTimeout(nextMinute,60000-(Date.now()%60000)+35);}
      document.addEventListener('visibilitychange',()=>{if(!document.hidden){firstRender=true;nextMinute();keepScreenAwake();}});
      nextMinute();peek();initBattery();
      window.addEventListener('load',()=>{if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});});
    })();
  </script>
